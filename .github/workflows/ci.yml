name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Build web package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout AbstractUIC shared packages
        run: git clone --depth 1 https://github.com/lpalbou/AbstractUIC.git ../abstractuic
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      # The lockfile guard (scripts/check_lock.mjs, no dependency needed): fails when
      # package-lock.json lags package.json or resolves an @abstractframework/*
      # package below its floor, in another major.minor, or from a local tarball.
      - name: Check the lockfile
        run: npm run check:lock
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test

  smokes:
    name: Bundled-flow smokes (real runtime, scripted models, no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the runtime
        # 0.7.0 carries the session history window entity_life_smoke proves.
        run: python -m pip install "abstractruntime>=0.7.0"
      - name: Run the smokes
        env:
          HOME: ${{ runner.temp }}/smoke-home
        run: |
          mkdir -p "$HOME"
          for smoke in entity_life_smoke entity_life_loop_smoke multiagent_coding_smoke \
                       coding_agent_v2_gates_smoke goal_agent_smoke react_coder_smoke \
                       ralph_coder_smoke coscientist_smoke; do
            echo "::group::$smoke"
            python "scripts/$smoke.py"
            echo "::endgroup::"
          done
